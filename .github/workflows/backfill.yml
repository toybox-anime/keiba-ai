name: backfill

# 取りこぼした過去分を、日付ごとの開催一覧からまとめて収集する手動ワークフロー（長期停止からの復旧用）。
# 6時間制限があるので、長期間なら10日前後ずつ区切って複数回に分けて実行する。
on:
  workflow_dispatch:
    inputs:
      from:
        description: "収集する開始日 YYYYMMDD（空欄=最終日の3日前）"
        default: ""
      to:
        description: "収集する最終日 YYYYMMDD（空欄=昨日）"
        default: ""

permissions:
  contents: write

concurrency:
  group: keiba-collect # collectと同じグループにして同時実行を避ける
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: バックフィル
        timeout-minutes: 300 # 時間切れでも下のコミットは走らせて途中までの分を残す
        run: >-
          python keiba.py backfill
          ${{ inputs.from && format('--from {0}', inputs.from) || '' }}
          ${{ inputs.to && format('--to {0}', inputs.to) || '' }}
      - name: コミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -f data/dataset.jsonl models/ data/auto.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更なし（収集ゼロ）"
          else
            git commit -m "chore: backfill ${{ inputs.from }}〜${{ inputs.to }}"
            git push
          fi
