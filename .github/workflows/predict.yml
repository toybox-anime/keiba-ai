name: predict-day

# 【停止中】有料Gemini APIをやめたため、朝の自動予想は無効化しています。
# 定時実行(schedule)を外したので、これ以上APIは呼ばれません（＝課金されません）。
# 再開したくなったら、下の schedule 行のコメントを外してください。
on:
  workflow_dispatch: {} # 手動実行のみ（自動では走らない）
  # schedule:
  #   - cron: "30 22 * * *"

permissions:
  contents: write

concurrency:
  group: keiba-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Tokyo
      GEMINI_API_KEY: ${{ secrets.KEIBAAI }} # Secret名が KEIBAAI（中身はGemini APIキー）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 本日の予想を生成（Gemini）
        run: python keiba.py predict-day --budget 5000
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -f predictions/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 本日の自動予想"
            git push
          fi
