name: daily-collect

# 毎晩クラウドで「本日の全開催を収集＋（データが増えれば）再学習」し、
# 更新した dataset / model をリポジトリにコミットして残す。
# cronが遅れて日付をまたいだ場合 auto は本日分をスキップし、backfill が前日分を回収する。
on:
  schedule:
    # GitHubのcronは混雑で数時間遅延する。JST日付が変わる前（UTC15:00前）に結果を拾えるよう、
    # 早め＋2回にして取りこぼしを防ぐ。分は混雑を避けて半端な値にする。
    - cron: "17 11 * * *" # 約 JST 20:17（遅延しても余裕をもって当日中）
    - cron: "47 12 * * *" # 約 JST 21:47（保険。ナイター結果を確実に）
  workflow_dispatch: {} # 手動実行（Actions画面のRun workflowボタン）
  push:
    branches: [main]
    paths: [".github/workflows/collect.yml"] # このファイルを変えた時だけ自動実行（動作確認用）

permissions:
  contents: write # dataset/model をコミットするため

concurrency:
  group: keiba-collect # backfill と同じグループ（同時実行しない）
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 60秒間隔の収集は長い。上限は6時間弱まで許容
    env:
      TZ: Asia/Tokyo # ログの時刻をJSTで記録（デバッグしやすく）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: 収集＋学習（auto）
        run: python keiba.py auto

      - name: 取りこぼし回収（直近3日・遅延実行の前日分もここで拾う）
        run: python keiba.py backfill --lookback 3

      - name: 紙上記録の答え合わせ（paper-live が昼に記録した分）
        run: python keiba.py paper || true

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dataset.jsonl models/ data/auto.log predictions/paper.jsonl predictions/paper_record.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更なし（新規データなし）"
            exit 0
          fi
          git commit -m "chore: 自動収集 $(date -u +%Y-%m-%d)"
          # backfill と同時にpushすることがあるので、取り込み直して数回再試行する
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1

      # 直近2日の開催がデータに入っていなければ失敗にする → GitHubから失敗通知メールが届く。
      # コミットの後に置くので、ここで失敗しても集めた分は保存済み。
      - name: 収集停止チェック
        run: python keiba.py health
